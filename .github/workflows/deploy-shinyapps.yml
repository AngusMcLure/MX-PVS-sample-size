name: Deploy Shiny app to shinyapps.io

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          # shinyapps.io may lag behind the latest R release.
          # Pin to the supported R 4.5 series rather than using setup-r's latest.
          r-version: '4.5.3'
          use-public-rspm: true

      - name: Install deployment and application packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: Rscript {0}
        run: |
          install.packages(c("remotes", "rsconnect", "shiny", "DT", "plotly", "statmod"))

      - name: Configure shinyapps.io account
        env:
          SHINYAPPS_ACCOUNT: ${{ secrets.SHINYAPPS_ACCOUNT }}
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        shell: Rscript {0}
        run: |
          stopifnot(
            nzchar(Sys.getenv("SHINYAPPS_ACCOUNT")),
            nzchar(Sys.getenv("SHINYAPPS_TOKEN")),
            nzchar(Sys.getenv("SHINYAPPS_SECRET"))
          )
          rsconnect::setAccountInfo(
            name = Sys.getenv("SHINYAPPS_ACCOUNT"),
            token = Sys.getenv("SHINYAPPS_TOKEN"),
            secret = Sys.getenv("SHINYAPPS_SECRET")
          )

      - name: Deploy the document
        env:
          SHINYAPPS_ACCOUNT: ${{ secrets.SHINYAPPS_ACCOUNT }}
          SHINYAPPS_APP_NAME: ${{ vars.SHINYAPPS_APP_NAME }}
        shell: Rscript {0}
        run: |
          app_name <- Sys.getenv("SHINYAPPS_APP_NAME")
          if (!nzchar(app_name)) app_name <- "mx-pvs-sample-size"

          rsconnect::deployDoc(
            doc = "group-testing-sample-size.Rmd",
            appName = app_name,
            account = Sys.getenv("SHINYAPPS_ACCOUNT"),
            appTitle = "MX PVS sample size",
            forceUpdate = TRUE
          )
